plugins {
    id 'com.android.application'
}

android {
    namespace 'com.victorlanes.travaapps'
    compileSdk 36

    defaultConfig {
        applicationId 'com.victorlanes.travaapps'
        minSdk 26
        targetSdk 36
        def runNumber = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
        versionCode Integer.parseInt(runNumber)
        versionName '1.0.' + runNumber
        // só processadores de celular (deixa o APK bem menor)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // Chave fixa: as novas versões instalam por cima sem perder rosto, PIN e apps bloqueados
    signingConfigs {
        app {
            storeFile file('travaapps.keystore')
            storePassword 'travaapps123'
            keyAlias 'travaapps'
            keyPassword 'travaapps123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.app }
        release {
            signingConfig signingConfigs.app
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // o modelo de reconhecimento facial precisa ficar sem compressão para ser mapeado na memória
    androidResources {
        noCompress 'tflite'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    def camerax = '1.4.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
}
